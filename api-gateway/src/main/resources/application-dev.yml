spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 4
          min-idle: 2

  cloud:
    gateway:
      routes:
        # Auth Service - Public Endpoints
        - id: auth-service-public
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/login,/api/auth/register,/api/auth/forgot-password,/api/auth/verify-email,/api/auth/reset-password
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                    replenishRate: 10
                    requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"
            - RewritePath=/api/auth/(?<segment>.*), /auth/$\{segment}

        # Logout Endpoint - Gateway level (always available)
        - id: logout
          uri: forward:///fallback/auth/logout
          predicates:
            - Path=/api/auth/logout
            - Method=POST
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                    replenishRate: 10
                    requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        # Auth Service - Protected Endpoints
        - id: auth-service-protected
          uri: ${AUTH_SERVICE_URL:http://localhost:8080}
          predicates:
            - Path=/api/auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: authServiceCircuitBreaker
                fallbackUri: forward:/fallback/auth
            - RewritePath=/api/auth/(?<segment>.*), /auth/$\{segment}
            - JwtAuthentication

        # Product Service (Local Development)
        - id: product-service
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/products/**,/api/categories/**,/api/brands/**
          filters:
            - name: CircuitBreaker
              args:
                name: productServiceCircuitBreaker
                fallbackUri: forward:/fallback/products
            - JwtAuthentication

        # Inventory Service
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCircuitBreaker
                fallbackUri: forward:/fallback/inventory
            - RewritePath=/api/inventory/(?<segment>.*), /api/inventory/$\{segment}
            - JwtAuthentication

        # Reservation Service (part of inventory-service)
        - id: reservation-service
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/reservations/**
          filters:
            - name: CircuitBreaker
              args:
                name: inventoryServiceCircuitBreaker
                fallbackUri: forward:/fallback/inventory
            - RewritePath=/api/reservations/(?<segment>.*), /api/reservations/$\{segment}
            - JwtAuthentication

        # Order Service
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8083}
          predicates:
            - Path=/api/orders/**
          filters:
            - name: CircuitBreaker
              args:
                name: orderServiceCircuitBreaker
                fallbackUri: forward:/fallback/orders
            - RewritePath=/api/orders/(?<segment>.*), /api/orders/$\{segment}
            - JwtAuthentication


      default-filters:
        - AddResponseHeader=X-Response-Time, static
        - AddResponseHeader=X-Environment, dev

jwt:
  secret: ${JWT_SECRET:Md2DcKtJIOAiWmkN3+VpZH6Eyu7fyZy03KB5hHyV5n4=}
  expiration: 3600000  # 1 hour

resilience4j:
  circuitbreaker:
    instances:
      authServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 70

      productServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 70

      inventoryServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 70

      orderServiceCircuitBreaker:
        baseConfig: default
        waitDurationInOpenState: 10s
        failureRateThreshold: 70

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always

server:
  port: 7999

logging:
  level:
    root: INFO
    com.ecommerce.apigateway: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty.http.client: DEBUG
    io.lettuce.core: DEBUG
