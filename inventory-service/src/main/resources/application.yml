spring:
  application:
    name: inventory-service
  jpa:
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8082

# Kafka topic configuration
kafka:
  topics:
    inventory-events: inventory-events
    product-events: product-events
    order-events: order-events

# Reservation configuration
app:
  reservation:
    default-expiry-minutes: 30
  scheduler:
    reservation-cleanup-interval: 300000  # 5 minutes

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

