spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/auth_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
    username: ${SPRING_DATASOURCE_USERNAME:auth}
    password: ${SPRING_DATASOURCE_PASSWORD:auth}

  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
        mail:
            smtp:
                auth: true
                starttls:
                    enable: true
    default-encoding: utf-8

jwt:
  secret: ${JWT_SECRET:Md2DcKtJIOAiWmkN3+VpZH6Eyu7fyZy03KB5hHyV5n4=}
  expiration: ${JWT_EXPIRATION:3600000}  # 1 hour
  expiration-refresh: ${JWT_REFRESH_EXPIRATION:86400000}  # 24 hours
  verfication-expiration: ${JWT_VERIFICATION_EXPIRATION:3600000}

logging:
  level:
    root: INFO
    com.ecommerce.authservice: DEBUG