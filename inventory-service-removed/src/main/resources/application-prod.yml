spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate  # Production should use validate, not auto-update
    database-platform: org.hibernate.dialect.MySQLDialect
    show-sql: false

  # Import secrets from AWS Secrets Manager
  config:
    import:
      - aws-secretsmanager:micro-ecommerce/product/db-configuration
  cloud:
    aws:
      cloudwatch:
        region: ap-southeast-2

logging:
  level:
    root: WARN
    com.ecommerce.productservice: INFO
